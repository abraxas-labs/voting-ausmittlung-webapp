<vo-lib-dialog [header]="'ELECTION.BALLOT_DETAIL.REPLACE_CANDIDATE' | translate" (dialogClose)="done()">
  <div content>
    <bc-button
      variant="tertiary"
      [label]="noReplacementLabel | translate"
      (buttonClick)="done()"
    ></bc-button>

    <bc-text
      [label]="'ELECTION.BALLOT_DETAIL.REPLACE_CANDIDATE_SEARCH_AND_REPLACE' | translate"
      (valueChange)="search($event)"
      [autoFocus]="true"
      optionalText=""
      [subscriptSizing]="'dynamic'"
    ></bc-text>

    <div class="candidate-list">
      @for (candidate of candidates; track candidate) {
        <vo-ausm-election-ballot-candidates-choose-entry (click)="done(candidate.candidate)" [choice]="candidate">
        </vo-ausm-election-ballot-candidates-choose-entry>
      }
    </div>
  </div>
</vo-lib-dialog>
